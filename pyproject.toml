[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uptime-kuma-mcp-server"
version = "1.0.0"
description = "A read-only MCP server for Uptime Kuma"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "clearminds"}]
keywords = ["mcp", "uptime-kuma", "monitoring", "uptime"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=2.14.0,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.urls]
Repository = "https://github.com/clearminds/uptime-kuma-mcp-server"

[project.scripts]
uptime-kuma-mcp-server = "uptime_kuma_mcp_server.server:main"
