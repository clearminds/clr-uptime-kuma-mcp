[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clr-uptime-kuma-mcp"
version = "1.1.0"
description = "An MCP server for Uptime Kuma"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "clearminds"}]
keywords = ["mcp", "uptime-kuma", "monitoring", "uptime"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=2.14.0,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uptime-kuma-api>=1.2.0",
]

[project.urls]
Repository = "https://github.com/clearminds/clr-uptime-kuma-mcp"

[project.scripts]
clr-uptime-kuma-mcp = "clr_uptime_kuma_mcp.server:main"
